# Builds the release downloads when a version tag (for example v1.0.0)
# is pushed, and publishes them on a GitHub release whose text comes from the
# matching section of CHANGELOG.md. Each download is first submitted to
# VirusTotal, and a table of scan links is added to the release notes.
#
# Requires the repository secret VT_API_KEY (a VirusTotal API key).
#
# Packaging, as in the Speech Output Engine:
#   * macOS: `opentrack --package-macos dist` (src/package/macos.rs) builds the
#     .app bundle, signs it ad hoc and wraps it in an installer package (.pkg)
#     that puts it in /Applications. The macos job tests installing it.
#   * Linux: `opentrack --package-deb dist` (src/package/linux.rs) builds a
#     Debian package (.deb) for Ubuntu and other Debian-based systems. The
#     linux job tests installing, upgrading and removing it.
#   * Windows: a PowerShell step in the windows job stages the exe with the
#     Visual C++ runtime DLLs it imports. WiX Toolset then builds an MSI
#     installer from those files, described by src/installer/opentrack.wxs,
#     and the job tests installing, upgrading and uninstalling it. The MSI's
#     version comes from the tag, so the tag must be three numbers such as
#     v1.0.0.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The MSI's version comes from the tag, but the app's own version (shown by
  # --version and in Settings, and used to name the .pkg and .deb) comes from
  # Cargo.toml. Check they match before anything is built.
  version:
    name: Check the tag matches Cargo.toml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(awk -F'"' '/^\[/ { section = $0 } section == "[package]" && /^version *=/ { print $2; exit }' Cargo.toml)
          if [ "$tag" != "$cargo" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match version \"$cargo\" in Cargo.toml. Set the version in Cargo.toml to $tag (and update Cargo.lock), or tag v$cargo instead."
            exit 1
          fi
          echo "Version: $cargo"

  windows:
    name: Windows (x86_64)
    needs: version
    runs-on: windows-latest
    env:
      # arch names the download, msvc is the Visual C++ folder name and wix
      # the MSI's platform.
      ARCH: x86_64
      MSVC: x64
      WIX_ARCH: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The MSI's version comes from the tag. Windows Installer versions are
      # three numbers, the first two at most 255 and the third at most 65535,
      # with nothing after them, so check the tag before the build.
      - name: Check the tag can be an MSI version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,4})$' -or
              [int]$Matches[1] -gt 255 -or [int]$Matches[2] -gt 255 -or [int]$Matches[3] -gt 65535) {
            Write-Host "::error::The tag $env:GITHUB_REF_NAME can't be used as a Windows Installer version. Use a tag such as v1.0.0: three numbers, the first two at most 255 and the third at most 65535, with no suffix such as -beta."
            exit 1
          }
          Write-Host "MSI version: $version"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # The prefix keeps these caches apart from CI's (ci.yml uses v1-rust-ci).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
      - run: cargo test --locked
      - run: cargo build --release --locked
      # Stage the exe with the Visual C++ runtime DLLs it uses, so it runs on
      # PCs without the Visual C++ Redistributable. The runtime list comes
      # from the exe's own imports; DLLs that are part of Windows are not
      # copied.
      - name: Stage the exe with its DLLs
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Host*\$env:MSVC\dumpbin.exe" | Select-Object -Last 1
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\$env:MSVC\Microsoft.VC*.CRT" -Directory | Select-Object -Last 1
          if (-not $dumpbin -or -not $crt) { throw "Visual C++ tools or runtime not found under $vs" }
          $imports = & $dumpbin.FullName /nologo /dependents target\release\opentrack.exe |
            ForEach-Object { $_.Trim() } | Where-Object { $_ -like '*.dll' }
          $dlls = $imports | ForEach-Object { Join-Path $crt.FullName $_ } | Where-Object { Test-Path $_ }
          if (-not $dlls) { throw "No Visual C++ runtime DLLs found in the exe's imports: $($imports -join ', ')" }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $folder = "opentrack-$version-windows-$env:ARCH"
          New-Item -ItemType Directory -Force "stage\$folder", dist | Out-Null
          Copy-Item -Path (@('target\release\opentrack.exe') + $dlls) -Destination "stage\$folder"
          Write-Host "Staged:" (Get-ChildItem "stage\$folder").Name
      # WiX Toolset builds the MSI. The version is pinned so that every
      # release is built the same way.
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          $wix = "$env:RUNNER_TEMP\wix"
          dotnet tool install wix --version 6.0.2 --tool-path $wix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$wix\wix.exe" extension add -g WixToolset.UI.wixext/6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wix >> $env:GITHUB_PATH
      # The MSI installs the files staged above. src\installer\opentrack.wxs
      # describes it; the Visual C++ runtime DLLs are whichever ones the step
      # above copied. wix build also runs the Windows Installer validation
      # checks (ICEs).
      - name: Build the MSI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $folder = "opentrack-$version-windows-$env:ARCH"
          $stage = (Resolve-Path "stage\$folder").Path
          $runtime = (Get-ChildItem $stage -Filter *.dll).Name
          wix build src\installer\opentrack.wxs -arch $env:WIX_ARCH -culture en-US -ext WixToolset.UI.wixext -pdbtype none `
            -d "Version=$version" -d "StageDir=$stage" -d "RuntimeDlls=$($runtime -join ';')" `
            -o "dist\$folder.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Checks that the MSI holds exactly the staged files, has the right
      # version, name and upgrade code, and installs without administrator
      # rights.
      - name: Check the MSI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $folder = "opentrack-$version-windows-$env:ARCH"
          $msi = (Resolve-Path "dist\$folder.msi").Path
          $upgradeCode = '{' + ([xml](Get-Content src\installer\opentrack.wxs)).Wix.Package.UpgradeCode + '}'
          # The Windows Installer COM objects only work through late binding.
          function Msi($object, $name, $kind, [object[]]$arguments) {
            $object.GetType().InvokeMember($name, $kind, $null, $object, $arguments)
          }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = Msi $installer OpenDatabase InvokeMethod @($msi, 0)
          function Query($sql) {
            $view = Msi $db OpenView InvokeMethod @($sql)
            Msi $view Execute InvokeMethod @() | Out-Null
            while ($record = Msi $view Fetch InvokeMethod @()) { Msi $record StringData GetProperty @(1) }
            Msi $view Close InvokeMethod @() | Out-Null
          }
          function Property($name) { Query "SELECT Value FROM Property WHERE Property = '$name'" }

          $problems = @()
          # File names are stored as "SHORT~1.DLL|long name.dll".
          $inMsi = Query 'SELECT FileName FROM File' | ForEach-Object { ($_ -split '\|')[-1] } | Sort-Object
          $staged = (Get-ChildItem "stage\$folder").Name | Sort-Object
          Write-Host "Files in the MSI:" ($inMsi -join ', ')
          if (Compare-Object @($inMsi) @($staged)) { $problems += "The MSI holds $($inMsi -join ', ') but the staged files are $($staged -join ', ')" }
          $expected = @{ ProductVersion = $version; UpgradeCode = $upgradeCode; ProductName = 'Open Budget Tracker'; Manufacturer = 'The Open Budget Tracker contributors' }
          foreach ($name in $expected.Keys) {
            $value = Property $name
            Write-Host "${name}: $value"
            if ($value -ne $expected[$name]) { $problems += "$name is '$value', not '$($expected[$name])'" }
          }
          if (Property ALLUSERS) { $problems += 'ALLUSERS is set, so the MSI would not install for the current user only' }
          # Bit 3 of the word count says that administrator rights aren't needed.
          $summary = Msi $installer SummaryInformation GetProperty @($msi, 0)
          if (-not ((Msi $summary Property GetProperty @(15)) -band 8)) { $problems += 'The MSI asks for administrator rights' }
          if ($problems) { $problems | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
      # Installs an older build of the same MSI, upgrades it to this one,
      # starts the installed app and uninstalls it, checking that the user's
      # settings and budget database are left alone throughout. The runner's
      # account is an administrator, so this can't show that ordinary
      # accounts need no administrator rights; the check above covers that.
      - name: Test installing, upgrading and uninstalling the MSI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $folder = "opentrack-$version-windows-$env:ARCH"
          $msi = (Resolve-Path "dist\$folder.msi").Path
          $stage = (Resolve-Path "stage\$folder").Path
          $upgradeCode = '{' + ([xml](Get-Content src\installer\opentrack.wxs)).Wix.Package.UpgradeCode + '}'
          $dir = "$env:LOCALAPPDATA\Programs\OpenBudgetTracker"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Open Budget Tracker.lnk"
          function Msi($object, $name, $kind, [object[]]$arguments) {
            $object.GetType().InvokeMember($name, $kind, $null, $object, $arguments)
          }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          # PowerShell unrolls the list of product codes into strings.
          function Installed {
            foreach ($code in @(Msi $installer RelatedProducts GetProperty @($upgradeCode))) {
              Msi $installer ProductInfo GetProperty @($code, 'VersionString')
            }
          }
          function Msiexec($arguments, $log) {
            $p = Start-Process msiexec.exe -ArgumentList ($arguments + '/qn', '/norestart', '/l*v', "`"$log`"") -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              Get-Content $log -Tail 60
              throw "msiexec $arguments failed with exit code $($p.ExitCode)"
            }
          }
          function Check($ok, $message) { if (-not $ok) { throw $message } }

          # Stand-ins for the settings and the budget database the app keeps.
          $kept = "$env:APPDATA\OpenBudgetTracker\msi-test.txt", "$env:LOCALAPPDATA\OpenBudgetTracker\msi-test.txt"
          $kept | ForEach-Object { New-Item -ItemType File -Force $_ | Out-Null }
          function Check-Kept($when) {
            $kept | ForEach-Object { Check (Test-Path $_) "$_ was removed $when" }
          }

          $runtime = (Get-ChildItem $stage -Filter *.dll).Name
          $old = "$env:RUNNER_TEMP\opentrack-old.msi"
          wix build src\installer\opentrack.wxs -arch $env:WIX_ARCH -culture en-US -ext WixToolset.UI.wixext -pdbtype none `
            -d "Version=0.0.1" -d "StageDir=$stage" -d "RuntimeDlls=$($runtime -join ';')" -o $old
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Msiexec @('/i', "`"$old`"") "$env:RUNNER_TEMP\install-old.log"
          Check ((Installed) -eq '0.0.1') "The older MSI did not install: $(Installed)"
          Check-Kept 'by installing'

          Msiexec @('/i', "`"$msi`"") "$env:RUNNER_TEMP\upgrade.log"
          $versions = @(Installed)
          Check ($versions.Count -eq 1 -and $versions[0] -eq $version) "After upgrading, the installed versions are: $($versions -join ', ')"
          Check-Kept 'by upgrading'
          $files = (Get-ChildItem $dir).Name | Sort-Object
          Check (-not (Compare-Object @($files) @((Get-ChildItem $stage).Name | Sort-Object))) "$dir holds: $($files -join ', ')"
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          Check ($target -eq "$dir\opentrack.exe") "The Start menu shortcut points at '$target'"
          # The app can't start if Windows can't find one of its DLLs.
          $out = "$env:RUNNER_TEMP\version.txt"
          $p = Start-Process $target -ArgumentList '--version' -RedirectStandardOutput $out -Wait -PassThru
          Check ($p.ExitCode -eq 0) "The installed app failed to start (exit code $($p.ExitCode))"
          Write-Host "Installed app says:" (Get-Content $out)

          Msiexec @('/x', "`"$msi`"") "$env:RUNNER_TEMP\uninstall.log"
          Check (-not (Installed)) "Still installed after uninstalling: $(Installed)"
          Check (-not (Test-Path $dir)) "$dir is still there after uninstalling"
          Check (-not (Test-Path $shortcut)) 'The Start menu shortcut is still there after uninstalling'
          Check (-not (Test-Path HKCU:\Software\OpenBudgetTracker\Installer)) 'HKCU\Software\OpenBudgetTracker\Installer is still there after uninstalling'
          Check-Kept 'by uninstalling'

          $kept | ForEach-Object { Remove-Item $_ }
          Write-Host 'Installed, upgraded, started and uninstalled; settings and data were kept.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x86_64
          path: dist/*.msi
          if-no-files-found: error

  macos:
    name: macOS .pkg (Apple Silicon)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
      - run: cargo test --locked
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: target/aarch64-apple-darwin/release/opentrack --package-macos dist
      - name: Test installing the package
        run: |
          set -euo pipefail
          pkg=$(ls dist/*.pkg)
          sudo installer -pkg "$pkg" -target /
          app="/Applications/Open Budget Tracker.app"
          codesign --verify --strict --verbose=2 "$app"
          echo "Installed app says: $("$app/Contents/MacOS/opentrack" --version)"
          pkgutil --pkg-info io.github.mediaswing.opentrack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: dist/*.pkg
          if-no-files-found: error

  linux:
    name: Linux .deb (x86_64)
    needs: version
    # The package works on the Ubuntu release it is built on and later ones,
    # since it needs the glibc it was built against (see src/package/linux.rs),
    # so build it on the oldest Ubuntu still supported.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the libraries for building a windowed app
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev gcc desktop-file-utils
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: target/release/opentrack --package-deb dist
      # Installs an older build of the same package, upgrades it to this one
      # (apt installs what it depends on), starts the installed app and removes
      # it, checking that the user's settings and budget database are left
      # alone throughout.
      - name: Test installing, upgrading and removing the package
        run: |
          set -euo pipefail
          deb=$(ls dist/*.deb)
          version=$(dpkg-deb --field "$deb" Version)
          dpkg-deb --info "$deb"
          desktop-file-validate dist/deb-root/usr/share/applications/opentrack.desktop

          # Stand-ins for the settings and the budget database the app keeps.
          kept=("$HOME/.config/opentrack/deb-test.txt" "$HOME/.local/share/opentrack/deb-test.txt")
          for f in "${kept[@]}"; do mkdir -p "$(dirname "$f")"; touch "$f"; done
          check_kept() {
            for f in "${kept[@]}"; do
              [ -f "$f" ] || { echo "::error::$f was removed $1"; exit 1; }
            done
          }

          # The same package with an older version, by rewriting its control file.
          old="$RUNNER_TEMP/opentrack-old.deb"
          cp -a dist/deb-root "$RUNNER_TEMP/old-root"
          sed -i 's/^Version: .*/Version: 0.0.1/' "$RUNNER_TEMP/old-root/DEBIAN/control"
          dpkg-deb --root-owner-group -Zxz --build "$RUNNER_TEMP/old-root" "$old"

          sudo apt-get install -y "$old"
          [ "$(dpkg-query -W -f='${Version}' opentrack)" = 0.0.1 ] || { echo "::error::The older package did not install"; exit 1; }
          check_kept 'by installing'

          sudo apt-get install -y "./$deb"
          installed=$(dpkg-query -W -f='${Version}' opentrack)
          [ "$installed" = "$version" ] || { echo "::error::After upgrading, the installed version is $installed"; exit 1; }
          check_kept 'by upgrading'
          dpkg -L opentrack
          [ "$(command -v opentrack)" = /usr/bin/opentrack ] || { echo "::error::opentrack is not on the PATH at /usr/bin"; exit 1; }
          echo "Installed app says: $(opentrack --version)"

          sudo apt-get remove -y opentrack
          if dpkg-query -W -f='${Status}' opentrack 2>/dev/null | grep -q 'ok installed'; then
            echo "::error::Still installed after removing"; exit 1
          fi
          for f in /usr/bin/opentrack /usr/share/applications/opentrack.desktop /usr/share/icons/hicolor/256x256/apps/opentrack.png; do
            [ ! -e "$f" ] || { echo "::error::$f is still there after removing"; exit 1; }
          done
          check_kept 'by removing'

          rm "${kept[@]}"
          echo 'Installed, upgraded, started and removed; settings and data were kept.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read release notes from CHANGELOG.md
        uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d # v3.1.0
        with:
          release_notes_file: changelog-notes.md
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      # Scan before publishing so the results can go into the release notes.
      # A VirusTotal outage must not block a release, so failures are allowed
      # and the scan table is simply left out.
      - name: Scan downloads with VirusTotal
        id: virustotal
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            artifacts/*.msi
            artifacts/*.pkg
            artifacts/*.deb
          # The free VirusTotal API allows 4 requests a minute.
          request_rate: 4
      - name: Write release notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCAN_OUTCOME: ${{ steps.virustotal.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');

            // The changelog section may be empty (or absent).
            let notes = fs.existsSync('changelog-notes.md')
              ? fs.readFileSync('changelog-notes.md', 'utf8').trim()
              : '';

            if (process.env.SCAN_OUTCOME === 'success') {
              const platform = (name) =>
                name.endsWith('.msi') ? 'Windows installer, x64' :
                name.includes('-macos-') ? 'Apple Silicon' :
                name.endsWith('.deb') ? 'Debian and Ubuntu, x64' : '';
              const rows = fs.readdirSync('artifacts').sort().map((name) => {
                const sha = crypto.createHash('sha256')
                  .update(fs.readFileSync(path.join('artifacts', name)))
                  .digest('hex');
                // The permanent report for this exact file.
                const url = `https://www.virustotal.com/gui/file/${sha}`;
                return `| \`${name}\` (${platform(name)}) | \`${sha}\` | [View scan](${url}) |`;
              });
              const table = [
                '## VirusTotal scans',
                '',
                '| Download | SHA-256 | Report |',
                '| --- | --- | --- |',
                ...rows,
              ].join('\n');
              notes = notes ? `${notes}\n\n${table}` : table;
            } else {
              core.warning('VirusTotal scan failed; publishing without scan results.');
            }

            fs.writeFileSync('release-notes.md', notes + '\n');
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          files: |
            artifacts/*.msi
            artifacts/*.pkg
            artifacts/*.deb
          fail_on_unmatched_files: true
