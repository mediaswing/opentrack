<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Budgeting app icon</title>
  <desc id="desc">A rounded navy tile with a bright teal wallet, gold coin, and rising budget bars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#07152E" flood-opacity=".32"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)"/>
  <circle cx="402" cy="104" r="58" fill="#FFFFFF" opacity=".06"/>
  <circle cx="95" cy="402" r="76" fill="#FFFFFF" opacity=".045"/>

  <!-- Subtle growth bars -->
  <g opacity=".24" fill="#99F6E4">
    <rect x="116" y="274" width="38" height="104" rx="12"/>
    <rect x="171" y="238" width="38" height="140" rx="12"/>
    <rect x="226" y="197" width="38" height="181" rx="12"/>
  </g>

  <!-- Wallet body -->
  <g filter="url(#shadow)">
    <path d="M112 180c0-23 19-42 42-42h194c23 0 42 19 42 42v23H154c-23 0-42 19-42 42v-65z" fill="#CCFBF1"/>
    <rect x="88" y="187" width="336" height="214" rx="42" fill="url(#wallet)"/>
    <path d="M88 232c0-23 19-42 42-42h252c23 0 42 19 42 42v34H130c-23 0-42 19-42 42v-76z" fill="#2DD4BF" opacity=".55"/>
    <path d="M302 256h122v105H302c-29 0-52-23-52-52s23-53 52-53z" fill="#0F766E"/>
    <path d="M302 268h122v81H302c-22 0-40-18-40-40s18-41 40-41z" fill="#115E59"/>
    <circle cx="316" cy="308" r="12" fill="#99F6E4"/>
    <path d="M128 220h125" stroke="#ECFEFF" stroke-width="10" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- Coin -->
  <g filter="url(#shadow)">
    <circle cx="355" cy="132" r="72" fill="#92400E" opacity=".28"/>
    <circle cx="348" cy="122" r="70" fill="url(#coin)"/>
    <circle cx="348" cy="122" r="56" fill="none" stroke="#FEF3C7" stroke-width="7" opacity=".9"/>
    <path d="M367 92c-5-7-13-11-23-11-14 0-24 8-24 19 0 12 10 17 25 21 15 4 25 9 25 22 0 12-11 21-27 21-12 0-23-5-29-14" fill="none" stroke="#92400E" stroke-width="10" stroke-linecap="round"/>
    <path d="M348 70v104" stroke="#92400E" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Small sparkle -->
  <path d="M151 111l8 20 20 8-20 8-8 20-8-20-20-8 20-8z" fill="#FDE68A"/>
</svg>
