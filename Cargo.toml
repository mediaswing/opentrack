[package]
name = "opentrack"
version = "1.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
directories = "6.0.0"
eframe = "0.37.0"
egui = "0.37"
egui_extras = { version = "0.37.0", features = ["datepicker"] }
egui_plot = "0.38.0"
jiff = "0.2.39"
log = "0.4.35"
mysql = "28.0.4"
rfd = "0.17.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simplelog = "0.12.2"
sys-locale = "0.3.2"
ureq = "3.5.1"


# Release packaging (src/package/linux.rs): builds the .deb in Rust.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
tar = "0.4"
# Compresses the .deb. Static, so the app doesn't link the system liblzma.
xz2 = { version = "0.1", features = ["static"] }
