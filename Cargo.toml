[package]
name = "opentrack"
version = "0.2.0"
edition = "2024"
# The newest that any dependency needs.
rust-version = "1.95"
description = "Open Budget Tracking: a simple, speech-friendly budget tracker"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mediaswing/opentrack"
publish = false
# The executable is `opentrack`; the app is "Open Budget Tracking".
autobins = false

[[bin]]
name = "opentrack"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
# The emoji font has the icons on the tabs, whatever fonts the computer has.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rfd = "0.17"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "unstable-locales"] }
dirs = "7.0.0"
log = { version = "0.4.35", features = ["std"] }
pure-rust-locales = "0.8.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1"
sys-locale = "0.3.2"
# Asks GitHub for the latest version number, and nothing else.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

# The macOS packager checks the finished .pkg in a temporary folder.
[target.'cfg(target_os = "macos")'.dependencies]
tempfile = "3"

[dev-dependencies]
egui_kittest = "0.37"
tempfile = "3"

[build-dependencies]
# Embeds the icon in the Windows executable.
winresource = "0.1"
